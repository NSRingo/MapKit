name: Dev
on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scripts:
    name: Build Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
      - name: Build Scripts
        run: npm run build:dev
      - name: Verify Script Bundles
        run: |
          test -s dist/request.dev.bundle.js
          test -s dist/response.dev.bundle.js
      - name: Upload Script Bundles
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: dist
          if-no-files-found: error

  modules:
    name: Generate Modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node
        with:
          package-token: ${{ secrets.PACKAGE_TOKEN }}
      - name: Generate Modules
        run: npm run build:dev-args
      - name: Verify Generated Modules
        run: |
          test -s dist/iRingo.MapKit.dev.sgmodule
          test -s dist/iRingo.MapKit.dev.plugin
          test -s dist/iRingo.MapKit.dev.snippet
          test -s dist/iRingo.MapKit.dev.stoverride
          test -s dist/iRingo.MapKit.dev.boxjs.json
      - name: Upload Modules
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: dist
          if-no-files-found: error

  package:
    name: Assemble Artifact
    needs: [scripts, modules]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download Script Bundles
        uses: actions/download-artifact@v4
        with:
          name: scripts
          path: dist
      - name: Download Modules
        uses: actions/download-artifact@v4
        with:
          name: modules
          path: dist
      - name: Verify Complete Artifact
        run: |
          test -s dist/request.dev.bundle.js
          test -s dist/response.dev.bundle.js
          for file in dist/iRingo.MapKit.dev.sgmodule dist/iRingo.MapKit.dev.plugin dist/iRingo.MapKit.dev.snippet dist/iRingo.MapKit.dev.stoverride; do
            test -s "$file"
            grep -Fq "https://gist.githubusercontent.com/VirgilClyne/b7524906119fa250bc933cc9a08e939a/raw/" "$file"
            grep -Fq "request.dev.bundle.js" "$file"
            grep -Fq "response.dev.bundle.js" "$file"
          done
          test -s dist/iRingo.MapKit.dev.boxjs.json
      - name: Upload Complete Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          if-no-files-found: error
          path: |
            CHANGELOG.md
            dist
